name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate theme files
        run: |
          php -r 'json_decode(file_get_contents("theme.json"), true, 512, JSON_THROW_ON_ERROR);'
          for f in functions.php patterns/*.php; do php -l "$f"; done
          git diff --check
          git diff --exit-code
